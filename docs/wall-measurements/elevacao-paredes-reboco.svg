<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 2400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#e8ecef"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#9fb2bd" stroke-width="1.5"/>
    </pattern>
    <marker id="arr" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M0,1.5 L11,5 L0,8.5 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <style>
