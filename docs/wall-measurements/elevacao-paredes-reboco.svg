    .ext { stroke:#6b7680; stroke-width:0.9; stroke-dasharray:3 3; }
    .cota { font-size:17px; font-weight:bold; fill:#111; paint-order:stroke; stroke:#ffffff; stroke-width:4px; }
    .lbl  { font-size:13.5px; fill:#333; paint-order:stroke; stroke:#ffffff; stroke-width:4px; }
