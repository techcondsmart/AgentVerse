    .slab { fill:#c9ced2; stroke:#555; stroke-width:1.2; }
    .wall { fill:url(#hatch); stroke:#333; stroke-width:2; }
    .vao  { fill:#ffffff; stroke:#333; stroke-width:2; }
    .xv   { stroke:#c3ccd2; stroke-width:1; }
