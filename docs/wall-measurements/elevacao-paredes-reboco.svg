  <!-- ===================== LEGENDA E NOTAS ===================== -->
  <rect x="120" y="1920" width="860" height="450" fill="#f7f9fa" stroke="#c4ccd2" stroke-width="1.2" rx="8"/>
  <text x="145" y="1952" class="titp">LEGENDA E NOTAS EXECUTIVAS</text>

  <rect x="145" y="1970" width="34" height="20" class="wall"/>
  <text x="188" y="1985" class="nota">Superfície a receber regularização + reboco (chapisco → emboço 2,0–2,5 cm)</text>
  <rect x="145" y="1998" width="34" height="20" fill="#e05252" fill-opacity="0.45" stroke="#b02020"/>
  <text x="188" y="2013" class="nota">Boneca (requadro lateral do vão) — executar no prumo e esquadro, e = 0,15</text>
  <line x1="145" y1="2036" x2="179" y2="2036" stroke="#b02020" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="188" y="2041" class="nota">Borda irregular de demolição / linha de forro — requadrar ou compatibilizar antes do reboco</text>

  <text x="145" y="2076" class="nota">1. Cotas em metros, levantadas em obra (fotos anotadas). Conferir todas as medidas antes da execução.</text>
  <text x="145" y="2100" class="nota">2. Parede 1 — verificação horizontal: 0,15 + 0,45 + 1,20 + 0,70 = 2,50 ✓ (confere com a cota geral anotada).</text>
  <text x="145" y="2124" class="nota">3. Parede 1 — vertical: 1,05 (peitoril) + 1,20 (janela) + 0,55 (topo) = 2,80; cota de topo anotada era 0,50 → conferir.</text>
  <text x="145" y="2148" class="nota">4. Parede 3 — reboco até o forro (2,35) ou até a laje (2,60): definir antes da execução do rebaixo.</text>
  <text x="145" y="2172" class="nota">5. Sequência executiva: remoção de argamassa colante solta e pó → chapisco (aderência) → taliscas/mestras</text>
  <text x="145" y="2192" class="nota">    niveladas → emboço sarrafeado e = 2,0–2,5 cm → requadro de bonecas, espaletas, vergas e peitoril.</text>
  <text x="145" y="2224" class="nota">6. Áreas estimadas de reboco (inclui requadros e espaletas):</text>
  <text x="175" y="2248" class="nota">Parede 1 ≈ 7,5 m² · Parede 2 ≈ 4,0 m² · Parede 3 ≈ 3,3 m² · Parede 4 ≈ 1,2 m² → TOTAL ≈ 16,0 m²</text>
  <text x="145" y="2272" class="nota">7. Com perdas de 10%: adotar ≈ 18 m². Consumo estimado: chapisco ≈ 80 kg;</text>
  <text x="145" y="2292" class="nota">    argamassa de emboço ≈ 720–900 kg (36 a 45 sacos de 20 kg), para espessura média de 2,0–2,5 cm.</text>
  <text x="145" y="2326" class="nota" font-style="italic" fill="#666">Desenho esquemático sem escala gráfica — dimensões válidas pelas cotas indicadas.</text>
  <text x="145" y="2348" class="nota" font-style="italic" fill="#666">Data do levantamento: 14/07/2026 · Uso: orçamento e execução de regularização e reboco.</text>
</svg>
